# parameters for train model

PATH:
  TRAIN_PATH: ./data/dataset/train/uw_train_class4.npy
  TEST_PATH: ./data/dataset/test/uw_test_class4.npy
  MODEL_PATH: ./results/RNN_uw_C4.pth #this model will be made in path
HYPERPARAMS:
  MODELTYPE: 'RNN'
  HIDDEN_SIZE: 128
  NUM_LAYERS: 2
  NUM_CLASSES: 4
  BATCH_SIZE: 128
  NUM_EPOCHS: 10
  LEARNING_RATE: 0.001
  LABEL_CLASS: ['unknown', 'standby', 'idling', 'cutting']
  LEN_FRAME: 150 # [ms]
FEATUREPARAMS:
  SAMPLING_RATE: 44100
  LEN_WINDOW: 1024
  HOP_LENGTH: 256
  CHUNK: 6615 # 50ms -> 2205, 100ms -> 4410 same as sample per frame
