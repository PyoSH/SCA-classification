# parameters for train model

PATH:
  TRAIN_PATH: ./data/dataset/train/uw_44kHz_100ms_train.npy
#  TRAIN_PATH: ./data/dataset/train/uw_44kHz_500ms_train_aug.npy
#  TRAIN_PATH: ./data/dataset/train/uw_44kHz_1sec_train_aug.npy
#  TRAIN_PATH: ./data/dataset/train/uw_44kHz_100ms_train_balanced.npy
#  TRAIN_PATH: ./data/dataset/train/uw_44kHz_500ms_train_balanced.npy

  TEST_PATH: ./data/dataset/test/uw_44kHz_100ms_test.npy
#  TEST_PATH: ./data/dataset/test/uw_44kHz_500ms_test_aug.npy
#  TEST_PATH: ./data/dataset/test/uw_44kHz_1sec_test_aug.npy

  SAMPLES_PATH: ./data/dataset/samples/uw_samples_44kHz_100ms_all.npy
#  SAMPLES_PATH: ./data/dataset/samples/uw_samples_44kHz_500ms_all_aug.npy
#  SAMPLES_PATH: ./data/dataset/samples/uw_samples_44kHz_1s_all_aug.npy

  INSPECTION_PATH: ./data/dataset/inspection/uw_44kHz_100ms_cutting.npy
#  INSPECTION_PATH: ./data/dataset/inspection/uw_44kHz_500ms_cutting.npy
#  INSPECTION_PATH: ./data/dataset/inspection/uw_44kHz_1000ms_cutting.npy

  MODEL_PATH: ./results/multi_scale/AMS-CLSTM_mel_init_SML_100ms.pth #this model will be made in path
HYPERPARAMS:
  MODELTYPE: 'C-MultiScale'
  HIDDEN_SIZE: 128
  NUM_LAYERS: 2
  NUM_CLASSES: 4
  BATCH_SIZE: 128
  NUM_EPOCHS: 30
  LEARNING_RATE: 0.001
  LABEL_CLASS: ['unknown', 'standby', 'idling', 'cutting']
  LEN_FRAME: 100 # [ms] 150
FEATUREPARAMS:
  SAMPLING_RATE: 44100
  LEN_WINDOW: 1024
  HOP_LENGTH: 256
  CHUNK: 4410 # 50ms -> 2205, 100ms -> 4410 same as sample per frame