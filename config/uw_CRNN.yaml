# parameters for train model

PATH:
  TRAIN_PATH: ./data/dataset/uw_train.npy
  TEST_PATH: ./data/dataset/uw_cutting.npy
  MODEL_PATH: ./results/CRNN_uw_all.pth #this model will be made in path
HYPERPARAMS:
  MODELTYPE: 'CRNN'
  HIDDEN_SIZE: 128
  NUM_LAYERS: 2
  NUM_CLASSES: 3
  BATCH_SIZE: 128
  NUM_EPOCHS: 100
  LEARNING_RATE: 0.001
  LABEL_CLASS: ['unknown','idling', 'cutting']
  LEN_FRAME: 150 # [ms]
FEATUREPARAMS:
  SAMPLING_RATE: 44100
  LEN_WINDOW: 1024
  HOP_LENGTH: 256
  CHUNK: 6615 # 50ms -> 2205, 100ms -> 4410 same as sample per frame
